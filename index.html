<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Бронирование мангала</title>
    <!-- MAX Bridge — без него объект window.WebApp не создастся -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #121212; color: #f2f2f2;
        margin: 0; padding: 12px;
      }
      h1 { margin: 8px 0 16px; font-size: 20px; text-align: center; }

      /* Плашка-предупреждение */
      .warn {
        background: #3a2f00; border: 1px solid #b58a00; color: #ffd54f;
        padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
      }

      /* Навигация по неделям */
      .week-nav {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 4px;
      }
      .week-nav button {
        background: none; border: 1px solid #333; color: #f2f2f2;
        width: 36px; height: 36px; border-radius: 50%;
        font-size: 18px; cursor: pointer;
      }
      .week-label { font-size: 14px; color: #bdbdbd; }

      /* Строка календаря */
      .week-grid {
        display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
      }
      .day-col {
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        padding: 8px 0; cursor: pointer; border-radius: 12px;
      }
      .day-col:active { background: #222; }
      .day-name { font-size: 11px; color: #9e9e9e; text-transform: uppercase; letter-spacing: 0.5px; }
      .day-num {
        width: 40px; height: 40px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: 600;
        border: 1.5px solid transparent;
      }
      .day-col.today .day-num { background: #f2f2f2; color: #121212; }
      .day-col.selected .day-num { border-color: #8ab4f8; }
      .day-col.past { opacity: 0.35; }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: #8ab4f8; }
      .spacer { width: 5px; height: 5px; } /* держит высоту ряда ровной */

      /* Подпись под календарём */
      .caption { text-align: center; color: #bdbdbd; font-size: 14px; margin: 10px 0 4px; }

      /* Список броней */
      .booking-list { margin-top: 10px; }
      .booking-item {
        background: #1e1e1e; border-left: 4px solid #ffb74d;
        padding: 8px 10px; margin: 6px 0; border-radius: 8px; font-size: 14px;
      }
      .booking-item .owner { font-weight: bold; }
      .booking-item .you { color: #8ab4f8; font-weight: bold; margin-left: 6px; }
      .booking-item .comment { color: #bdbdbd; font-size: 12px; }
      .cancel-btn {
        background: #e53935; color: white; border: none;
        padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
      }
      .empty-note { color: #888; font-size: 14px; text-align: center; margin-top: 20px; }

      /* Форма */
      form {
        background: #1e1e1e; padding: 14px; border-radius: 12px; margin-top: 14px;
      }
      form label { font-size: 13px; color: #bdbdbd; display: block; margin-bottom: 6px; }
      textarea {
        width: 100%; padding: 10px; background: #2a2a2a; color: #f2f2f2;
        border: 1px solid #444; border-radius: 8px; font-size: 14px;
        font-family: inherit; resize: vertical;
      }
      .submit-btn {
        width: 100%; padding: 12px; margin-top: 10px;
        background: #8ab4f8; color: #121212; border: none; border-radius: 10px;
        font-weight: 600; font-size: 15px; cursor: pointer;
      }
      .submit-btn:disabled { background: #444; color: #888; }
      .status { margin-top: 8px; font-size: 13px; color: #bdbdbd; }
      .hidden { display: none; }
      .hint { font-size: 12px; color: #777; margin-top: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <h1>🍖 Бронирование мангала</h1>

    <div id="warn" class="warn hidden">
      Не удалось определить чат: запустите приложение из группового чата с ботом.
      Календарь открыт, но брони не подгрузятся.
    </div>

    <!-- Навигация по неделям -->
    <div class="week-nav">
      <button id="prevWeek" type="button">‹</button>
      <span class="week-label" id="weekLabel"></span>
      <button id="nextWeek" type="button">›</button>
    </div>

    <!-- Календарь -->
    <div class="week-grid" id="weekGrid"></div>
    <div class="caption" id="caption"></div>

    <!-- Брони выбранного дня -->
    <div id="dayDetails">
      <div class="booking-list" id="bookingList"></div>
    </div>

    <!-- Форма бронирования -->
    <form id="bookingForm">
      <label>Комментарий (кол-во человек, что привезти и т.п.)</label>
      <textarea id="comment" placeholder="Например: 4 человека, мясо, плед" rows="3" required></textarea>
      <button type="submit" id="submitBtn" class="submit-btn">Забронировать</button>
      <div id="status" class="status"></div>
    </form>

    <p class="hint">Точка под числом — день забронирован. Отменить может только создатель.</p>

    <script>
      // === ВСТАВЬТЕ СЮДА URL ВАШЕГО GOOGLE APPS SCRIPT ===
      const API_URL = 'https://script.google.com/macros/s/AKfycbxMrOKsT9YTJHASW-GMC2xeurjuej-e3d97RGYJXe1mT1pJa_NWANJTxUGEVcbz4sOpeA/exec';

      // Данные из MAX Bridge (запасной вариант — Telegram API)
      const bridge = window.WebApp || window.Telegram?.WebApp || null;
      const initDataUnsafe = (bridge && bridge.initDataUnsafe) || {};

      // В MAX chat приходит как объект { id, type: 'DIALOG' | 'CHAT' | 'CHANNEL' }
      const chatInfo = initDataUnsafe.chat || null;
      const isGroupChat = !!chatInfo &&
        (chatInfo.type === 'CHAT' || chatInfo.type === 'CHANNEL');
      const chatId = isGroupChat ? String(chatInfo.id) : null;
      const userName =
        (initDataUnsafe.user && (initDataUnsafe.user.first_name || initDataUnsafe.user.username)) || 'Гость';

      if (!chatId) {
        // НЕ заменяем страницу, а просто показываем плашку сверху
        document.getElementById('warn').classList.remove('hidden');
        console.log('initDataUnsafe:', JSON.stringify(initDataUnsafe));
      }

      let bookings = [];      // все брони чата
      let weekOffset = 0;     // сдвиг по неделям
      let selectedDate = toKey(new Date());

      const DAY_NAMES = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];

      // ---------- Утилиты дат ----------
      function toKey(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function startOfWeek(d) {
        const copy = new Date(d);
        const diff = (copy.getDay() + 6) % 7; // ПН = 0
        copy.setDate(copy.getDate() - diff);
        copy.setHours(0, 0, 0, 0);
        return copy;
      }

      function todayKey() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return toKey(d);
      }

      function fmtRange(base) {
        const end = new Date(base);
        end.setDate(base.getDate() + 6);
        const opt = { day: 'numeric', month: 'long' };
        const a = base.toLocaleDateString('ru-RU', opt);
        const b = end.toLocaleDateString('ru-RU', opt);
        return `${a} – ${b}`;
      }

      // ---------- Календарь ----------
      function renderCalendar() {
        const grid = document.getElementById('weekGrid');
        grid.innerHTML = '';

        const base = startOfWeek(new Date());
        base.setDate(base.getDate() + weekOffset * 7);

        document.getElementById('weekLabel').textContent = fmtRange(base);

        const tKey = todayKey();

        for (let i = 0; i < 7; i++) {
          const d = new Date(base);
          d.setDate(base.getDate() + i);
          const key = toKey(d);

          const col = document.createElement('div');
          col.className = 'day-col';
          col.dataset.date = key;

          if (key === tKey) col.classList.add('today');
          if (key === selectedDate) col.classList.add('selected');
          if (key < tKey) col.classList.add('past');
          if (bookings.some(b => b.date === key)) col.classList.add('has-booking');

          const name = document.createElement('span');
          name.className = 'day-name';
          name.textContent = DAY_NAMES[i];
          col.appendChild(name);

          const num = document.createElement('span');
          num.className = 'day-num';
          num.textContent = d.getDate();
          col.appendChild(num);

          const dot = document.createElement('span');
          dot.className = bookings.some(b => b.date === key) ? 'dot' : 'spacer';
          col.appendChild(dot);

          col.addEventListener('click', () => selectDay(key));
          grid.appendChild(col);
        }

        // Подпись под календарём
        const selDate = new Date(selectedDate + 'T00:00:00');
        const prefix = selectedDate === tKey ? 'Сегодня, ' : '';
        document.getElementById('caption').textContent =
          prefix + selDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
      }

      function selectDay(key) {
        selectedDate = key;
        renderCalendar();
        showDetails(key);
      }

      // ---------- Данные ----------
      async function loadBookings() {
        if (!chatId) return; // без чата данные не грузим
        try {
          const resp = await fetch(`${API_URL}?chat_id=${encodeURIComponent(chatId)}`);
          const data = await resp.json();
          if (data.status === 'ok') {
            bookings = data.data;
            renderCalendar();
            showDetails(selectedDate);
          }
        } catch (e) {
          console.error(e);
        }
      }

      function showDetails(date) {
        const list = document.getElementById('bookingList');
        list.innerHTML = '';

        const dayBookings = bookings.filter(b => b.date === date);

        if (dayBookings.length === 0) {
          list.innerHTML = '<div class="empty-note">На эту дату броней нет</div>';
          return;
        }

        dayBookings.forEach(b => {
          const el = document.createElement('div');
          el.className = 'booking-item';

          const isOwner = b.user_name === userName;
          const youBadge = isOwner ? '<span class="you">(ваша бронь)</span>' : '';
          const cancelHtml = isOwner
            ? `<button class="cancel-btn" data-row-id="${b.row_id}">Отменить</button>`
            : '';

          el.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <div>
                <span class="owner">Создал: ${b.user_name}</span>${youBadge}<br>
                <span class="comment">${b.comment}</span>
              </div>
              ${cancelHtml}
            </div>`;
          list.appendChild(el);
        });

        list.querySelectorAll('.cancel-btn').forEach(btn => {
          btn.addEventListener('click', () => cancelBooking(btn.dataset.rowId, btn));
        });
      }

      // ---------- Отмена брони ----------
      async function cancelBooking(rowId, btn) {
        btn.disabled = true;
        btn.textContent = 'Отмена...';
        try {
          const formData = new FormData();
          formData.append('action', 'cancel');
          formData.append('row_id', rowId);
          formData.append('user_name', userName);

          const resp = await fetch(API_URL, { method: 'POST', body: formData });
          const result = await resp.json();

          if (result.status === 'success') {
            await loadBookings();
          } else {
            alert('Ошибка: ' + (result.message || 'Не удалось отменить'));
          }
        } catch (err) {
          alert('Ошибка сети: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Отменить';
        }
      }

      // ---------- Форма ----------
      document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('status');
        const btn = document.getElementById('submitBtn');

        if (!chatId) {
          status.textContent = '❌ Нет chat_id: откройте приложение из группового чата.';
          return;
        }
        if (selectedDate < todayKey()) {
          status.textContent = '❌ Нельзя бронировать прошедшие даты.';
          return;
        }

        const comment = document.getElementById('comment').value;
        btn.disabled = true;
        status.textContent = 'Отправка...';

        try {
          const formData = new FormData();
          formData.append('action', 'add');
          formData.append('date', selectedDate);
          formData.append('comment', comment);
          formData.append('chat_id', chatId);
          formData.append('user_name', userName);

          const resp = await fetch(API_URL, { method: 'POST', body: formData });
          const result = await resp.json();

          if (result.status === 'success') {
            status.textContent = '✅ Бронь оформлена!';
            document.getElementById('comment').value = '';
            await loadBookings();
            setTimeout(() => { status.textContent = ''; }, 2000);
          } else {
            status.textContent = '❌ Ошибка: ' + (result.message || 'Не удалось сохранить');
          }
        } catch (err) {
          status.textContent = '❌ Ошибка сети: ' + err.message;
        } finally {
          btn.disabled = false;
        }
      });

      // ---------- Стрелки недель ----------
      document.getElementById('prevWeek').addEventListener('click', () => {
        weekOffset--;
        renderCalendar();
      });
      document.getElementById('nextWeek').addEventListener('click', () => {
        weekOffset++;
        renderCalendar();
      });

      // ---------- Старт ----------
      renderCalendar();
      showDetails(selectedDate);
      loadBookings();
    </script>
  </body>
</html>
