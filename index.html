<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Бронирование мангала (MAX)</title>
    <!-- Подключаем SDK MAX -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #121212; color: #f2f2f2;
        margin: 0; padding: 12px;
      }
      h1 { margin: 8px 0 16px; font-size: 20px; text-align: center; }
      .warn {
        background: #3a2f00; border: 1px solid #b58a00; color: #ffd54f;
        padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
      }
      .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
      .week-nav button {
        background: none; border: 1px solid #333; color: #f2f2f2;
        width: 36px; height: 36px; border-radius: 50%;
        font-size: 18px; cursor: pointer;
      }
      .week-label { font-size: 14px; color: #bdbdbd; }
      .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .day-col {
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        padding: 8px 0; cursor: pointer; border-radius: 12px;
      }
      .day-col:active { background: #222; }
      .day-name { font-size: 11px; color: #9e9e9e; text-transform: uppercase; letter-spacing: 0.5px; }
      .day-num {
        width: 40px; height: 40px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: 600;
        border: 1.5px solid transparent;
      }
      .day-col.today .day-num { background: #f2f2f2; color: #121212; }
      .day-col.selected .day-num { border-color: #8ab4f8; }
      .day-col.past { opacity: 0.35; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #8ab4f8; }
      .spacer { width: 6px; height: 6px; }
      .caption { text-align: center; color: #bdbdbd; font-size: 14px; margin: 10px 0 4px; }
      .booking-list { margin-top: 10px; }
      .booking-item {
        background: #1e1e1e; border-left: 4px solid #ffb74d;
        padding: 8px 10px; margin: 6px 0; border-radius: 8px; font-size: 14px;
      }
      .booking-item .owner { font-weight: bold; }
      .booking-item .you { color: #8ab4f8; font-weight: bold; margin-left: 6px; }
      .booking-item .comment { color: #bdbdbd; font-size: 12px; }
      .booking-item .avatar {
        width: 24px; height: 24px; border-radius: 50%;
        vertical-align: -4px; margin-left: 8px; margin-right: 8px;
        object-fit: cover;
      }
      .cancel-btn {
        background: #e53935; color: white; border: none;
        padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
      }
      .empty-note { color: #888; font-size: 14px; text-align: center; margin-top: 20px; }
      form { background: #1e1e1e; padding: 14px; border-radius: 12px; margin-top: 14px; }
      form label { font-size: 13px; color: #bdbdbd; display: block; margin-bottom: 6px; }
      textarea {
        width: 100%; padding: 10px; background: #2a2a2a; color: #f2f2f2;
        border: 1px solid #444; border-radius: 8px; font-size: 14px;
        font-family: inherit; resize: vertical;
      }
      .submit-btn {
        width: 100%; padding: 12px; margin-top: 10px;
        background: #8ab4f8; color: #121212; border: none; border-radius: 10px;
        font-weight: 600; font-size: 15px; cursor: pointer;
      }
      .submit-btn:disabled { background: #444; color: #888; }
      .status { margin-top: 8px; font-size: 13px; color: #bdbdbd; }
      .hidden { display: none; }
      .hint { font-size: 12px; color: #777; margin-top: 12px; text-align: center; }
      .debug { font-size: 10px; color: #ff4d4d; text-align: center; margin-top: 8px; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>🍖 Бронирование мангала</h1>

    <div id="warn" class="warn hidden">
      Не удалось определить чат: запустите приложение из группового чата с ботом.
    </div>

    <div class="week-nav">
      <button id="prevWeek" type="button">‹</button>
      <span class="week-label" id="weekLabel"></span>
      <button id="nextWeek" type="button">›</button>
    </div>

    <div class="week-grid" id="weekGrid"></div>
    <div class="caption" id="caption"></div>

    <div class="booking-list" id="bookingList"></div>

    <form id="bookingForm">
      <label>Комментарий (Время, со скольки и до скольки...)</label>
      <textarea id="comment" placeholder="Например: с 17 до 19 или до талого..." rows="3" required></textarea>
      <button type="submit" id="submitBtn" class="submit-btn">Забронировать</button>
      <div id="status" class="status"></div>
    </form>

    <p class="hint">Точка под числом — день забронирован. Отменить может только создатель.</p>
    <div class="debug" id="debug"></div>

    <script>
      // === ВАЖНО: ВСТАВЬТЕ СЮДА ВАШ URL ИЗ НОВОГО ДЕПЛОЯ (Publish → New deployment) ===
      const API_URL = 'https://script.google.com/macros/s/AKfycbyjst_HknGVqLkd06KfWuY_w_QNkkQKFIkWELCSIholS6wxTHExRwzvWzXlGCyv9tFO6w/exec';

      // Инициализация MAX
      const bridge = window.WebApp;
      if (bridge) {
        try { bridge.ready(); bridge.expand(); } catch (err) {}
      }

      const initDataUnsafe = (bridge && bridge.initDataUnsafe) || {};
      const chatInfo = initDataUnsafe.chat || null;
      const isGroupChat = !!chatInfo &&
        (chatInfo.type === 'CHAT' || chatInfo.type === 'CHANNEL');
      const chatId = isGroupChat ? String(chatInfo.id) : null;
      const userName =
        (initDataUnsafe.user && (initDataUnsafe.user.first_name || initDataUnsafe.user.username)) || 'Гость';
      const userPhoto = (initDataUnsafe.user && initDataUnsafe.user.photo_url) || '';

      if (!chatId) {
        document.getElementById('warn').classList.remove('hidden');
        setDebug('Нет chat_id: приложение нужно запускать из группового чата.');
      }

      let bookings = [];
      let weekOffset = 0;
      let selectedDate = toKey(new Date());

      const DAY_NAMES = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];

      function setDebug(text) {
        const el = document.getElementById('debug');
        if (el) el.textContent = text;
      }

      function toKey(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function parseKey(key) {
        const parts = key.split('-');
        return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      }

      function startOfWeek(d) {
        const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const diff = (copy.getDay() + 6) % 7; // ПН = 0
        copy.setDate(copy.getDate() - diff);
        return copy;
      }

      function todayKey() {
        return toKey(new Date());
      }

      function fmtRange(base) {
        const end = new Date(base.getTime());
        end.setDate(base.getDate() + 6);
        const opt = { day: 'numeric', month: 'long' };
        return base.toLocaleDateString('ru-RU', opt) + ' – ' + end.toLocaleDateString('ru-RU', opt);
      }

      async function loadBookings() {
        if (!chatId) {
          setDebug('Нет chat_id: календарь работает, но брони не загрузятся');
          renderCalendar();
          showDetails(selectedDate);
          return;
        }

        const cacheKey = 'bookings_' + chatId;

        // Сначала показываем из кэша, чтобы не было ощущения «ничего не загрузилось»
        try {
          const cached = localStorage.getItem(cacheKey);
          if (cached) {
            bookings = JSON.parse(cached);
            renderCalendar();
            showDetails(selectedDate);
          }
        } catch (err) {
          setDebug('Ошибка чтения кэша: ' + err.message);
        }

        const status = document.getElementById('status');
        if (status && !status.textContent) status.textContent = 'Загружаю брони...';

        try {
          // t= нужен, чтобы браузер не кэшировал ответ и не показывал старые данные
          const url = API_URL + '?chat_id=' + encodeURIComponent(chatId) + '&t=' + Date.now();
          const resp = await fetch(url, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          });

          if (!resp.ok) {
            throw new Error('HTTP ' + resp.status + ' (' + resp.statusText + ')');
          }

          const data = await resp.json();

          if (data.status === 'ok' && Array.isArray(data.data)) {
            bookings = data.data.map(b => ({
              date: String(b.date || '').substring(0, 10),
              comment: b.comment || '',
              chat_id: String(b.chat_id || ''),
              user_name: String(b.user_name || ''),
              row_id: String(b.row_id || ''),
              photo_url: String(b.photo_url || '')
            }));

            try { localStorage.setItem(cacheKey, JSON.stringify(bookings)); } catch (e) {}
            setDebug('Загружено броней: ' + bookings.length);
          } else {
            setDebug('Сервер вернул неожиданный формат: ' + JSON.stringify(data));
          }
        } catch (e) {
          setDebug('Ошибка загрузки: ' + e.message);
          console.error('loadBookings error:', e);
        }

        if (status) status.textContent = '';
        renderCalendar();
        showDetails(selectedDate);
      }

      function renderCalendar() {
        const grid = document.getElementById('weekGrid');
        grid.innerHTML = '';

        const base = startOfWeek(new Date());
        base.setDate(base.getDate() + weekOffset * 7);
        document.getElementById('weekLabel').textContent = fmtRange(base);

        const tKey = todayKey();

        for (let i = 0; i < 7; i++) {
          const d = new Date(base.getTime());
          d.setDate(base.getDate() + i);
          const key = toKey(d);

          const col = document.createElement('div');
          col.className = 'day-col';
          col.dataset.date = key;

          if (key === tKey) col.classList.add('today');
          if (key === selectedDate) col.classList.add('selected');
          if (key < tKey) col.classList.add('past');

          const hasBooking = bookings.some(b => b.date === key);

          const name = document.createElement('span');
          name.className = 'day-name';
          name.textContent = DAY_NAMES[i];
          col.appendChild(name);

          const num = document.createElement('span');
          num.className = 'day-num';
          num.textContent = d.getDate();
          col.appendChild(num);

          const dot = document.createElement('span');
          dot.className = hasBooking ? 'dot' : 'spacer';
          col.appendChild(dot);

          if (key >= tKey) {
            col.addEventListener('click', () => selectDay(key));
          }
          grid.appendChild(col);
        }

        const prefix = selectedDate === tKey ? 'Сегодня, ' : '';
        document.getElementById('caption').textContent =
          prefix + parseKey(selectedDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
      }

      function selectDay(key) {
        selectedDate = key;
        renderCalendar();
        showDetails(key);
      }
      function showDetails(date) {
        const list = document.getElementById('bookingList');
        list.innerHTML = '';

        const dayBookings = bookings.filter(b => b.date === date);

        if (dayBookings.length === 0) {
          list.innerHTML = '<div class="empty-note">На эту дату броней нет</div>';
          return;
        }

        dayBookings.forEach(b => {
          const el = document.createElement('div');
          el.className = 'booking-item';

          const isOwner = b.user_name === userName;
          const youBadge = isOwner ? '<span class="you">(ваша бронь)</span>' : '';
          const cancelHtml = isOwner
            ? '<button class="cancel-btn" data-row-id="' + b.row_id + '">Отменить</button>'
            : '';

          const avatarHtml = b.photo_url
            ? '<img class="avatar" src="' + b.photo_url + '" alt="" />'
            : '<div class="avatar" style="background:#555;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;">?</div>';

          el.innerHTML = `
            ${avatarHtml}
            <div>
              <span class="owner">${escapeHtml(b.user_name)}</span> ${youBadge}
              <div class="comment">${escapeHtml(b.comment)}</div>
            </div>
            ${cancelHtml}
          `;

          if (isOwner) {
            el.querySelector('.cancel-btn').addEventListener('click', async () => {
              await cancelBooking(b.row_id);
            });
          }

          list.appendChild(el);
        });
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      async function cancelBooking(rowId) {
        if (!chatId) {
          setDebug('chat_id отсутствует — отмена невозможна');
          return;
        }
        const btn = event.target;
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Отмена...';

        try {
          const url = API_URL;
          const payload = {
            action: 'cancel',
            chat_id: chatId,
            row_id: rowId
          };

          const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!resp.ok) {
            throw new Error('HTTP ' + resp.status);
          }

          const data = await resp.json();
          if (data.status === 'ok') {
            loadBookings(); // перечитать список
          } else {
            setDebug('Отмена не прошла: ' + (data.message || 'Неизвестная ошибка'));
            btn.disabled = false;
            btn.textContent = originalText;
          }
        } catch (e) {
          setDebug('Ошибка отмены: ' + e.message);
          console.error('cancelBooking error:', e);
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }

      document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!chatId) {
          setDebug('chat_id отсутствует — бронирование невозможно');
          return;
        }

        const comment = document.getElementById('comment').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('submitBtn');

        btn.disabled = true;
        status.textContent = 'Бронирую...';

        try {
          const url = API_URL;
          const payload = {
            action: 'book',
            chat_id: chatId,
            date: selectedDate,
            comment: comment,
            user_name: userName,
            photo_url: userPhoto || ''
          };

          const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!resp.ok) {
            throw new Error('HTTP ' + resp.status);
          }

          const data = await resp.json();
          if (data.status === 'ok') {
            status.textContent = 'Успешно забронировано!';
            setTimeout(() => status.textContent = '', 3000);
            document.getElementById('comment').value = '';
            loadBookings();
          } else {
            status.textContent = data.message || 'Ошибка бронирования';
            console.warn('Server response:', data);
          }
        } catch (e) {
          status.textContent = 'Ошибка: ' + e.message;
          console.error('book error:', e);
        } finally {
          btn.disabled = false;
        }
      });

      // Запуск загрузки при старте
      loadBookings();
    </script>
  </body>
</html>
